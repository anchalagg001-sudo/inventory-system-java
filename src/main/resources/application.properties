# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/electrical_inventory?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2109
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=MySecretKeyForElectricalInventorySystem2024VeryLongAndSecure
app.jwt.expiration=86400000

# File Upload (optional)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS (allow frontend)
spring.web.cors.allowed-origins=*

# Logging
logging.level.com.inventory=DEBUG
